# Publica el formulario en GitHub Pages en cada push a la rama.
# La primera ejecución activa Pages automáticamente (enablement: true).
name: Publicar en GitHub Pages

on:
  push:
    branches: ["claude/contact-form-email-0954bz"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar los archivos de la web
        run: |
          mkdir -p _site
          cp index.html styles.css app.js gracias.html _site/
          cp -r qr _site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
