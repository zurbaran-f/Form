# Publica el formulario en GitHub Pages en cada push a la rama.
# Requiere que en Settings → Pages el origen (Source) sea "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: ["claude/contact-form-email-0954bz"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar los archivos de la web
        run: |
          mkdir -p _site
          cp index.html styles.css app.js gracias.html _site/
          cp -r qr _site/
          # Sella los enlaces a CSS/JS con el commit actual para que los
          # navegadores no sirvan una versión antigua desde su caché.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html _site/gracias.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4

      # Comprueba que la web responde de verdad, no solo que el despliegue
      # dijo que sí. Deja en el registro el código HTTP de cada dirección.
      - name: Comprobar que la web responde
        run: |
          publicada="${{ steps.despliegue.outputs.page_url }}"
          echo "Dirección publicada: $publicada"
          for intento in 1 2 3 4; do
            codigo=$(curl -s -o /tmp/pagina.html -w "%{http_code}" -L "$publicada")
            echo "Intento $intento -> HTTP $codigo"
            [ "$codigo" = "200" ] && break
            sleep 10
          done
          echo "--- primeras líneas de lo que sirve ---"
          head -c 300 /tmp/pagina.html
          echo ""
          echo "--- otras direcciones, para comparar ---"
          for url in             "https://zurbaran-f.github.io/Form/"             "https://zurbaran-f.github.io/form/"             "https://zurbaran-f.github.io/Form/index.html"             "https://zurbaran-f.github.io/"; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' -L "$url")  $url"
          done
          [ "$codigo" = "200" ]
